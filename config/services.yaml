services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Servicio principal del cliente API - NOMBRE CORREGIDO
  Estratos\DomainNameApi\Service\DomainNameApiClient:
    arguments:
      $username: '%domainname_api.username%'
      $password: '%domainname_api.password%'
      $testMode: '%domainname_api.test_mode%'
    public: true

  # Alias para facilitar el uso
  domainname_api.client:
    alias: Estratos\DomainNameApi\Service\DomainNameApiClient
    public: true

  # Servicio de utilidades
  Estratos\DomainNameApi\Service\DomainNameApiUtils:
    public: true

  # Registrar comandos de consola
  Estratos\DomainNameApi\Command\:
    resource: '../src/Command'
    tags: ['console.command']