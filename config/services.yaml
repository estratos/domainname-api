services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Servicio principal del cliente API
  Estratos\DomainNameApi\Service\DomainNameApiClient:
    arguments:
      $username: '%env(DOMAINNAME_API_USERNAME)%'
      $password: '%env(DOMAINNAME_API_PASSWORD)%'
      $testMode: '%env(bool:DOMAINNAME_API_TEST_MODE)%'
    public: true

  # Alias para facilitar el uso
  domainname_api.client:
    alias: Estratos\DomainNameApi\Service\DomainNameApiClient
    public: true

  # Servicio de utilidades
  Estratos\DomainNameApi\Service\DomainNameApiUtils:
    public: true

  # Registrar comandos de consola - CORREGIDO: usar ruta absoluta
  Estratos\DomainNameApi\Command\:
    resource: '%kernel.project_dir%/vendor/estratos/domainname-api/src/Command'
    tags: ['console.command']

  # Registrar servicios del bundle - CORREGIDO: usar ruta absoluta
  Estratos\DomainNameApi\:
    resource: '%kernel.project_dir%/vendor/estratos/domainname-api/src/*'
    exclude: '%kernel.project_dir%/vendor/estratos/domainname-api/src/{Entity,Repository,Tests,Kernel.php}'